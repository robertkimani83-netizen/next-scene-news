name: Ingest News (VOX254)

# Nov 14 2026: the site's only automatic ingest trigger was Vercel's daily
# cron (vercel.json, 06:00 UTC), and each /api/cron run adds at most 3
# stories. Since mid-September the site has been getting ~0-1 new articles a
# day. This workflow calls the same ingest route every hour so the article
# pool (website + Facebook + Reels) keeps filling up again.

on:
  workflow_dispatch:
  schedule:
    - cron: '50 * * * *'

concurrency:
  group: news-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/cron
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          SITE="${SITE_URL%/}"
          SECRET="$(printf '%s' "$CRON_SECRET" | tr -d '[:space:]')"
          code=$(curl -sS -o resp.json -w '%{http_code}' --max-time 120 \
            -H "Authorization: Bearer $SECRET" "$SITE/api/cron")
          echo "HTTP $code"
          head -c 3000 resp.json; echo
          if [ "$code" != "200" ]; then exit 1; fi
