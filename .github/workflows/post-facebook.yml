name: Post to Facebook

on:
  workflow_dispatch:
  schedule:
    - cron: '*/20 * * * *'

# Only one Facebook publisher run may be active at a time. This prevents
# overlapping scheduled runs from selecting the same article before its
# temporary Redis claim is visible.
concurrency:
  group: facebook-posting
  cancel-in-progress: false

jobs:
  post-facebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Facebook posting script
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/post-facebook.mjs
