name: Generate NextScene TV Short

on:
  schedule:
    - cron: "5 8,13,18 * * *"
  workflow_dispatch:
    inputs:
      upload:
        description: "Actually upload to YouTube? Leave unchecked to just generate a short and review it first."
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install dependencies
        run: npm install

      - name: Generate short (review only - manual run without "upload" checked)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.upload != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_API_KEY: ${{ secrets.UNSPLASH_API_KEY }}
        run: npm run test-short-no-upload

      - name: Debug - check OAuth secret lengths
        if: github.event_name == 'schedule' || github.event.inputs.upload == 'true'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          echo "GOOGLE_CLIENT_ID length: ${#GOOGLE_CLIENT_ID} (expected 72)"
          echo "GOOGLE_CLIENT_SECRET length: ${#GOOGLE_CLIENT_SECRET} (expected 35)"
          echo "YOUTUBE_REFRESH_TOKEN length: ${#YOUTUBE_REFRESH_TOKEN} (expected 101)"
          echo "GOOGLE_CLIENT_ID starts with: ${GOOGLE_CLIENT_ID:0:5}"
          echo "GOOGLE_CLIENT_SECRET starts with: ${GOOGLE_CLIENT_SECRET:0:6}"
          echo "YOUTUBE_REFRESH_TOKEN starts with: ${YOUTUBE_REFRESH_TOKEN:0:4}"

      - name: Generate and upload short (scheduled runs, or manual run with "upload" checked)
        if: github.event_name == 'schedule' || github.event.inputs.upload == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_API_KEY: ${{ secrets.UNSPLASH_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: npm run generate-short

      - name: Save topic history
        if: github.event_name == 'schedule' || github.event.inputs.upload == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/topic-history-short.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Shorts topic history [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "No topic history changes to commit"
          fi

      - name: Upload short as artifact for review (kept 7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-output
          path: tmp/*/final_short.mp4
          retention-days: 7