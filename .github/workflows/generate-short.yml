name: Generate NextScene TV Short

on:
  # Oct 10 2026: switched from the old "money & power" Shorts (no views)
  # to a daily Kenya story Short built from VOX254's top Kenya story with
  # a REAL news photo (scripts/generate-kenya-short.mjs). No suitable
  # story = no Short that day (never stock footage).
  # Uploads land as PRIVATE so the owner reviews them in YouTube Studio.
  # 15:05 UTC = 18:05 Doha / 18:05 Nairobi.
  schedule:
    - cron: "5 15 * * *"
  workflow_dispatch:
    inputs:
      upload:
        description: "Actually upload to YouTube? Leave unchecked to just build the Short for review (artifact)."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install dependencies
        run: npm install

      - name: Build Kenya Short (review only - manual run without "upload" checked)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.upload != 'true'
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run test-kenya-short-no-upload

      - name: Build and upload Kenya Short (scheduled runs, or manual run with "upload" checked)
        if: github.event_name == 'schedule' || github.event.inputs.upload == 'true'
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: private
        run: npm run generate-kenya-short

      - name: Upload the Short as an artifact for review (kept 7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kenya-short-output
          path: tmp/*/final_short.mp4
          if-no-files-found: ignore
          retention-days: 7
