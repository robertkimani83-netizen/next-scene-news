name: Generate NextScene TV Documentary

on:
  schedule:
    # every 6 hours — adjust once you've confirmed quality/timing you like
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      upload:
        description: "Actually upload to YouTube? Leave unchecked to just generate a video and review it first."
        type: boolean
        default: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install dependencies
        run: npm install

      - name: Generate documentary (review only — manual run without "upload" checked)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.upload != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_API_KEY: ${{ secrets.UNSPLASH_API_KEY }}
        run: npm run test-no-upload

      - name: Generate and upload documentary (scheduled runs, or manual run with "upload" checked)
        if: github.event_name == 'schedule' || github.event.inputs.upload == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_API_KEY: ${{ secrets.UNSPLASH_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: npm run generate

      - name: Upload video as artifact for review (kept 7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentary-output
          path: tmp/*/final.mp4
          retention-days: 7
